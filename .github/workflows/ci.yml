name: Secure File Vault CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm --prefix backend ci || npm --prefix backend install
          npm --prefix frontend ci || npm --prefix frontend install

      - name: Generate Prisma Engine
        run: |
          npm --prefix backend run prisma:generate

      - name: Run Cryptographic & Security Test Suite
        env:
          NODE_ENV: test
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci_jwt_test_secret_64_characters_long_for_security_testing_purpose_123"
          MASTER_KEY_HEX: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          HMAC_DOWNLOAD_SECRET: "ci_hmac_test_secret_for_url_signatures_123456"
        run: |
          npm --prefix backend test

      - name: Compile Backend TypeScript
        run: |
          npm --prefix backend run build

      - name: Build Frontend React SPA
        run: |
          npm --prefix frontend run build

  docker-verify:
    name: Verify Multi-Stage Docker Image
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: secure-file-vault:latest
